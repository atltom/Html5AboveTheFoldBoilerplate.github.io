excavation:
  services:
    heading: "Our Excavation & Site Development Services"
    intro: >
      We provide professional digging, land clearing, and site preparation services for properties across Massachusetts.
    items:
      - title: "Site Clearing & Demolition"
        anchor: site-clearing
        paragraphs:
          - >
            Every great building project starts with a completely clean slate. We quickly clear raw land by removing unwanted trees, thick brush, hidden boulders, and old structures so your property is immediately ready for development.
        features:
          heading: "Popular Land Clearing Features"
          items:
            - Tree and stump removal
            - Heavy brush mowing and clearing
            - Old building and structure demolition
            - Rock and ledge management
            - Clean debris hauling and disposal
        benefits:
          heading: "Benefits of Professional Land Clearing"
          items:
            - Gets rid of hidden hazards before building begins.
            - Creates clean, clear borders for accurate construction layouts.
            - Stops buried wood from rotting under your future buildings.

      - title: "Grading & Foundation Excavation"
        anchor: grading-foundations
        paragraphs:
          - >
            Precise grading fixes the slope of your land so rainwater drains away safely. We dig perfect foundation holes for new basements, layout deep structural trenches, and test the soil to make sure the ground can easily support the weight of your new building.
        features:
          heading: "Popular Grading & Foundation Options"
          items:
            - Cellar hole digging for homes
            - Commercial building foundation cuts
            - Laser-guided precision dirt leveling
            - Backfilling and heavy dirt packing
            - Subgrade prep for driveways and slabs
        benefits:
          heading: "Benefits of Structural Grading"
          items:
            - Keeps your new basement dry and safe from rainwater leaks.
            - Creates a perfectly flat, uniform base for concrete work.
            - Prevents foundations from shifting, cracking, or settling.

      - title: "Underground Utilities & Septic Systems"
        anchor: underground-utilities
        paragraphs:
          - >
            We dig deep, accurate utility trenches to install or repair vital underground lines. From brand-new septic systems and town sewer tie-ins to clean water lines, gas connections, and electrical lines, we handle all the heavy digging needed to hook up your site.
        features:
          heading: "Popular Utility Options"
          items:
            - Main town water hookups
            - Sewer line extensions and connections
            - Complete septic system installations
            - Deep utility pipe trenching
            - Emergency line leak repairs
        benefits:
          heading: "Benefits of Professional Utility Digging"
          items:
            - Follows all local Massachusetts plumbing and building codes.
            - Pipes are buried deep below the frost line to prevent freezing.
            - Uses clean bedding sand to protect pipes from underground rocks.

      - title: "Stormwater Management & Recharging"
        anchor: stormwater-management
        paragraphs:
          - >
            Don't let heavy New England rainstorms flood your construction plans. We install high-tech Cultec underground chambers and heavy-duty storm drains that collect massive rainwater runoff from roofs and driveways, keeping your yard perfectly dry.
        features:
          heading: "Popular Stormwater Solutions"
          items:
            - Cultec underground chamber arrays
            - Catch basin and backyard drain building
            - Foundation curtain drain systems
            - Swale and culvert drainage grading
            - Retaining wall pipe installations
        benefits:
          heading: "Benefits of Modern Stormwater Control"
          items:
            - Protects low-lying homes during extreme 100-year rain storms.
            - Stops muddy surface water from eroding your beautiful landscaping.
            - Meets all EPA Phase II Clean Water Act safety rules.

