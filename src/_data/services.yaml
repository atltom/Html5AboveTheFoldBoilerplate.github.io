  faq:
    heading: "Frequently Asked Questions"
    items:
      - question: "What types of excavation services do you handle?"
        answer: >
          We handle complete residential and commercial site work. This includes clearing raw land, structural demolition, digging foundation holes, precision laser grading, utility trenching, septic system installations, and advanced storm drain building.
      - question: "Why is soil testing important before digging a foundation?"
        answer: >
          Testing the soil tells us how tightly the dirt is packed and where the underground water table sits. Knowing this helps us plan the perfect foundation cut and ensures your new building will never shift or crack over time.
      - question: "How do underground Cultec chambers protect my yard?"
        answer: >
          Cultec chambers act as an invisible, underground storage tank for rainwater. During a heavy downpour, water from your roof and driveway is guided into these buried chambers, filtering out dirt and slowly releasing the water safely back into the ground without flooding your lawn.
      - question: "Do you secure all the necessary town digging permits?"
        answer: >
          Yes. S. Phaneuf & Associates manages the entire permitting process. We secure all municipal licenses and ensure your site work completely follows the EPA's Phase II Clean Water Act regulations.
      - question: "How long does a typical site clearing and grading project take?"
        answer: >
          A simple house lot can often be cleared and graded in just a few days. Larger commercial developments or properties requiring deep utility connections can take a few weeks. We will give you a clear, written schedule before any heavy machinery arrives.
      - question: "Can you fix existing drainage and pooling water issues?"
        answer: >
          Absolutely. We regularly fix muddy lawns and wet basements by re-grading slopes, installing foundation curtain drains, and building custom catch basins to guide rainwater away from your home.

