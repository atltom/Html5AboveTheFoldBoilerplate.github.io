  process:
    heading: "Our Excavation & Site Development Process"
    intro: >
      Every successful building project begins with rock-solid groundwork and precise planning. Our proven site development process allows us to prepare raw land safely while ensuring every foundation cut, utility trench, and storm drain network performs perfectly. Throughout the digging process, we keep Massachusetts property owners completely informed so there are no surprises from the first scoop of dirt to the final grade.
    steps:
      - title: "Consultation & Plan Review"
        description: >
          We meet with you right on your property to review your engineering blueprints, check the land layout, and discuss your construction goals. We evaluate the soil, look at the slopes, and map out an efficient excavation plan that fits your project timeline and budget perfectly.
      - title: "Permits & Site Layout"
        description: >
          Before any heavy machinery arrives, our team secures all necessary town digging licenses and environmental permits. We carefully stake out the exact construction lines and mark underground utility paths to guarantee that all clearing and digging operations are completed safely and legally.
      - title: "Clearing & Heavy Excavation"
        description: >
          Our experienced operators bring in top-tier excavators and bulldozers to clear away trees, boulders, and old structures. Next, we execute deep structural cuts for home basements, commercial foundation slabs, septic systems, or deep underground utility lines exactly to your blueprint specs.
      - title: "Drainage & Subgrade Compaction"
        description: >
          We install robust stormwater solutions like underground Cultec chambers and catch basins to manage heavy rainwater. We then use heavy-duty compactors to tightly pack the subgrade dirt layers, creating a rock-solid, uniform base that prevents future buildings, driveways, or roads from shifting.
      - title: "Final Laser Grading & Cleanup"
        description: >
          We use precision laser grading to smooth out the topsoil, establishing the perfect final slopes so water naturally drains completely away from your new structures. We haul away remaining debris, clean the job site thoroughly, and leave a pristine, ready-to-build canvas for your construction crew.
      - title: "Final Project Walkthrough"
        description: >
